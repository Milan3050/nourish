# Local infrastructure. For day-to-day development run only `db` and `phoenix` here
# (make infra) and the API, MCP server and web app natively with hot reload (make dev).
# `docker compose --profile app up --build` runs everything in containers.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: nip
      POSTGRES_PASSWORD: nip
      POSTGRES_DB: nip
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nip"]
      interval: 3s
      retries: 20

  phoenix:  # OpenTelemetry trace UI for LLM, tool and agent spans (local dev only)
    # Pinned (v21.1.0). Phoenix >= 21 enables auth by default and rejected every OTLP export with 401;
    # this instance is local-only, so auth is off. Production uses an authenticated OTLP collector.
    image: arizephoenix/phoenix@sha256:09ec48906c054a27dd09a88c8e6bcc24fe89649d3ecc94d3a8ed394e21279b31
    environment:
      PHOENIX_ENABLE_AUTH: "false"
    ports: ["127.0.0.1:6006:6006"]

  mcp:
    profiles: [app]
    build: { context: ., dockerfile: backend/Dockerfile }
    command: ["python", "-m", "nip.mcp_server.server"]
    environment:
      NIP_IN_DOCKER: "1"   # local endpoints (localhost) are reached on the host
      NIP_MCP_HOST: 0.0.0.0
      NIP_MCP_ALLOWED_HOSTS: "mcp:*,localhost:*,127.0.0.1:*"  # Host headers accepted (DNS-rebinding guard)
      NIP_DATABASE_URL: postgresql://nip:nip@db:5432/nip
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on: { db: { condition: service_healthy } }

  api:
    profiles: [app]
    build: { context: ., dockerfile: backend/Dockerfile }
    env_file: [.env]
    environment:
      NIP_DATABASE_URL: postgresql://nip:nip@db:5432/nip
      NIP_TOOL_TRANSPORT: mcp
      NIP_MCP_SERVER_URL: http://mcp:8765/mcp
      NIP_IN_DOCKER: "1"   # the LLM URL comes from .env; only localhost URLs are rewritten to the host
      NIP_OTEL_ENDPOINT: http://phoenix:6006/v1/traces
      NIP_CORS_ORIGINS: '["http://localhost:8080","http://localhost:5173"]'
    ports: ["${NIP_API_HOST_PORT:-8000}:8000"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on: { db: { condition: service_healthy }, mcp: { condition: service_started } }

  web:
    profiles: [app]
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [api]

volumes:
  pgdata:
